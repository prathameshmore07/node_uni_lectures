<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ecommerce</title>
    <style>
        .productcard{
            width: 300px;
            padding: 25px;
            margin: 60px auto;
            border: 4px solid black;
            text-align: center;
        }
        .productcard img{
            width:200px;
            transition: 0.2s;
        }
        button{
            padding: 10px;
            margin: 8px;
            cursor: pointer;
        }

    </style >
    </head>

    <body>

        <div class="productcard" id="productCard">
            <img id="productImage" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR0JBUrahbFNt6RNK-34MZM5PT6modCbD3aL2RcfyYQvQ&s"alt="Product Image">
        
        <h2>TTT Sahur Poster</h2>
        <p>Price: ₹6767 </p>
        <button id="cartBtn">Add to cart</button>
        <button id="wishlistBtn">Add to wishlist</button>
        <button id="deleteBtn">Delete</button>

    </div>
    <script>
    const productCard=document.getElementById("productCard");
    const productImage=document.getElementById("productImage");
    const cartBtn=document.getElementById("cartBtn");
    const wishlistBtn=document.getElementById("wishlistBtn");
    const deleteBtn=document.getElementById("deleteBtn");

    productCard.addEventListener("click",(event)=>{
        console.log("product details opened");
        console.log("event.target:",event.target);
        console.log("event.currentTarget:",event.currentTarget);
          });
    
     productCard.addEventListener("dblclick", () => {
        console.log("img zoomed");
        productImage.style.width="300px";

     });


    cartBtn.addEventListener("click",(event)=>{
         event.stopPropagation();
        console.log("product added to cart ");
        cartBtn.disabled=true;
    });

    wishlistBtn.addEventListener("click",(event)=>{
        event.stopPropagation();
        console.log("added to wishlist");
        wishlistBtn.innerText="❤️ wishlisted";
    });

    deleteBtn.addEventListener("click",(event)=>{
        event.preventDefault();
        event.stopPropagation();
        const confirmDelete=confirm(
             "are u sure u want to delete this product?") ;
             if (confirmDelete){
                productCard.remove();
             }  
    });
    
    productCard.addEventListener("mouseover",()=>{
        productCard.style.border="4px solid black";
    });

    productCard.addEventListener("mouseout",()=>{
      productCard.style.border="2px solid gray";
    });


</script>

    
</body>
</html>
